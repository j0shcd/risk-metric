name: CI Quality And Benchmark

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-benchmark-gate:
    runs-on: ubuntu-latest
    env:
      REFRESH_API_SOURCES: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Run benchmark gate
        run: |
          python -m risk_engine.benchmark_gate \
            --sota config/ci_benchmark_baseline.json \
            --foundation config/ci_benchmark_foundation.json
