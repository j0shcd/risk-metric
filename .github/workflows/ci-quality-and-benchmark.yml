name: CI Quality And Benchmark

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-benchmark-gate:
    runs-on: ubuntu-latest
    env:
      REFRESH_API_SOURCES: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Run benchmark gate
        run: |
          python -m risk_engine.benchmark_gate \
            --sota config/ci_benchmark_baseline.json \
            --foundation config/ci_benchmark_foundation.json

  web-test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Run web tests
        working-directory: web
        run: npm test

      - name: Build web app
        working-directory: web
        run: npm run build
