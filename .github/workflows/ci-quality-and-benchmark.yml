name: CI Quality And Benchmark

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-benchmark-gate:
    runs-on: ubuntu-latest
    env:
      REFRESH_API_SOURCES: "false"
      RISK_END_DATE: "2026-05-14"

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Detect model changes
        id: model-change
        run: |
          changed=$(python -m risk_engine.model_acceptance changed \
            --canonical config/model_acceptance_canonical.json)
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Evaluate changed model on frozen data
        if: steps.model-change.outputs.changed == 'true'
        run: |
          set +e
          python -m risk_engine.evaluation.cli run \
            --profile standard \
            --output-dir /tmp/model-acceptance-evaluation \
            --run-id candidate
          status=$?
          set -e
          test "$status" -eq 0 -o "$status" -eq 2

      - name: Enforce model acceptance
        if: steps.model-change.outputs.changed == 'true'
        run: |
          python -m risk_engine.model_acceptance produce \
            --run-dir /tmp/model-acceptance-evaluation/runs/candidate \
            --output /tmp/model-acceptance-candidate.json
          python -m risk_engine.model_acceptance compare \
            --candidate /tmp/model-acceptance-candidate.json \
            --canonical config/model_acceptance_canonical.json \
            --policy config/model_acceptance.json \
            --output /tmp/model-acceptance-report.json

      - name: Run legacy benchmark diagnostic
        continue-on-error: true
        run: |
          python -m risk_engine.benchmark_gate \
            --sota config/ci_benchmark_baseline.json \
            --foundation config/ci_benchmark_foundation.json

  web-test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node 22 (policy-compliant)
        run: |
          curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash -
          sudo apt-get install -y nodejs
          node --version
          npm --version
          test "$(node -p 'process.versions.node.split(`.`)[0]')" = "22"

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Run alert core tests
        run: node --test scripts/lib/alerts-core.test.mjs web/functions/api/_lib/validate.test.mjs

      - name: Run web tests
        working-directory: web
        run: npm test

      - name: Build web app
        working-directory: web
        run: npm run build
