name: Manual validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-security:
    permissions:
      contents: read
    uses: ./.github/workflows/dependency-security.yml

  backend-tests:
    needs: dependency-security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REFRESH_API_SOURCES: "false"
      RISK_END_DATE: "2026-05-14"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          check-latest: true

      - name: Install Python dependencies
        run: 'pip install --require-hashes --only-binary=:all: -r requirements.txt'

      - name: Prepare model acceptance runtime
        run: cp config/model_acceptance_runtime.json config/runtime.json

      - name: Run unit tests
        run: python -m unittest discover -s tests

  web-test-and-build:
    needs: dependency-security
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup verified Node 22
        uses: ./.github/actions/setup-node

      - name: Install web dependencies
        working-directory: web
        run: npm ci --ignore-scripts

      - name: Run script tests
        run: node --test scripts/lib/*.test.mjs

      - name: Run web tests
        working-directory: web
        run: npm test

      - name: Build web app
        working-directory: web
        run: npm run build
