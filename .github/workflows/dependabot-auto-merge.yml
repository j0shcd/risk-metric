name: Guarded Dependabot security patches

on:
  workflow_run:
    workflows: ["CI Quality And Benchmark"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: dependabot-security-automerge
  cancel-in-progress: false

jobs:
  merge-security-patch:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - name: Checkout trusted default branch only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Setup verified Node 22
        uses: ./.github/actions/setup-node

      - name: Merge only a verified security patch
        run: node scripts/dependabot-auto-merge.mjs
        env:
          GH_TOKEN: ${{ github.token }}
