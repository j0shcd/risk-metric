name: Daily Web Publish

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-web-data:
    runs-on: ubuntu-latest
    env:
      DATA_PROFILE: extended
      ENABLE_OPTIONAL_SOCIAL_SOURCES: "true"
      ENABLE_GOOGLE_TRENDS_SOURCE: "false"
      ENABLE_PAID_SOURCES: "false"
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      YOUTUBE_CHANNEL_IDS: ${{ secrets.YOUTUBE_CHANNEL_IDS }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      FRED_API: ${{ secrets.FRED_API_KEY }}
      WIKIMEDIA_API_TOKEN: ${{ secrets.WIKIMEDIA_API_TOKEN }}
      WIKIMEDIA_API_USER_AGENT: ${{ secrets.WIKIMEDIA_API_USER_AGENT }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Ensure BTC daily store exists
        run: python backfill.py --target btc-price

      - name: Refresh caches from APIs + publish web export
        env:
          REFRESH_API_SOURCES: "true"
        run: python publish_web_v1.py

      - name: Verify cache-only execution
        env:
          REFRESH_API_SOURCES: "false"
        run: python publish_web_v1.py

      - name: Stage web artifacts and cache files
        id: detect_changes
        run: |
          git add -f data/web/v2 || true
          git add -f \
            data/btc_daily.csv \
            data/total_marketcap.csv \
            data/onchain_metrics.csv \
            data/fear_greed_index.csv \
            data/youtube_interest.csv \
            data/youtube_channel_ids.csv \
            data/google_trends_interest.csv \
            data/coinbase_app_rank.csv \
            data/fred_dxy.csv \
            data/fred_real_yield_10y.csv \
            data/fred_walcl.csv \
            data/fred_rrpontsyd.csv \
            data/btc_market_coingecko.csv \
            data/wikipedia_pageviews_btc.csv \
            data/reddit_post_volume.csv || true

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated web artifacts and caches
        if: steps.detect_changes.outputs.changed == 'true'
        run: |
          git config user.name "risk-metric-bot"
          git config user.email "risk-metric-bot@users.noreply.github.com"
          git commit -m "chore(data): refresh caches + web v2 artifacts"
          git push origin HEAD:main

      - name: No artifact changes
        if: steps.detect_changes.outputs.changed != 'true'
        run: echo "No data/web/v2 changes detected."
