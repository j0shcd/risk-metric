name: Daily Web Publish

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-web-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline + validation + web export
        run: python publish_web_v1.py

      - name: Detect artifact changes
        id: detect_changes
        run: |
          if git diff --quiet -- data/web/v1; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated web artifacts
        if: steps.detect_changes.outputs.changed == 'true'
        run: |
          git config user.name "risk-metric-bot"
          git config user.email "risk-metric-bot@users.noreply.github.com"
          git add -f data/web/v1
          git commit -m "chore(data): refresh web v1 artifacts"
          git push origin HEAD:main

      - name: No artifact changes
        if: steps.detect_changes.outputs.changed != 'true'
        run: echo "No data/web/v1 changes detected."
