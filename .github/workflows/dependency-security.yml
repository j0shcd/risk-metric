name: Dependency security

on:
  schedule:
    - cron: "17 5 * * *"
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check dependency policy
        run: python3 -m unittest discover -s tests -p test_dependency_security.py

      - name: Scan all locked dependencies for known vulnerabilities and malware
        run: bash scripts/security-check.sh
