name: Verified Node 22
description: Use the patched Node binary in an isolated hosted-runner directory
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        test "$(uname -s)/$(uname -m)" = Linux/x86_64
        test "$(cat web/.node-version)" = 22.23.5
        node_dir=$(mktemp -d "$RUNNER_TEMP/risk-node.XXXXXX")
        curl --fail --location --retry 2 --connect-timeout 15 --max-time 180 \
          https://nodejs.org/dist/v22.23.5/node-v22.23.5-linux-x64.tar.xz \
          --output "$node_dir/node.tar.xz"
        echo "cdeb8670a0c81f51b4dc4ac61919f9b1ad917b304bf8221eb939570663d240f8  $node_dir/node.tar.xz" | sha256sum --check -
        tar -xJf "$node_dir/node.tar.xz" -C "$node_dir"
        "$node_dir/node-v22.23.5-linux-x64/bin/node" --version
        test "$("$node_dir/node-v22.23.5-linux-x64/bin/node" --version)" = "v$(cat web/.node-version)"
        echo "$node_dir/node-v22.23.5-linux-x64/bin" >> "$GITHUB_PATH"
